aid: built-robotics
name: Built Robotics
description: 'Built Robotics is a San Francisco robotics company, founded in 2016 by
  Noah Ready-Campbell and Andrew Liang, that turns conventional heavy construction
  equipment into AI-powered autonomous robots. Its Exosystem retrofit kit converts
  excavators and other earthmoving machines into self-operating robots for trenching,
  foundation excavation and pad grading, while the RPD 35 and RPS 25 autonomous pile
  drivers install foundations for utility-scale solar farms. Machines are supervised
  from the Everest command center, and field deployment is run through its Built Solar
  Technologies (built.solar) division. The company reports $114M raised and 25+ commercial
  deployments across the United States and Australia. Built Robotics publishes no public
  developer API, SDK or machine-readable API contract; its only public developer artifact
  is the open-source rsplan Reeds-Shepp path-planning library on PyPI and GitHub.'
